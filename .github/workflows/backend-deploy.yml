name: Backend CI/CD

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-deploy.yml"

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: aastu-clinic-backend
  AWS_ACCOUNT_ID: "516737672784"
  AWS_ROLE_ARN: arn:aws:iam::516737672784:role/aastu-clinic-github-actions
  ECR_URI: 516737672784.dkr.ecr.eu-central-1.amazonaws.com/aastu-clinic-backend
  EC2_INSTANCE_ID: i-00f5942defa192a98

jobs:
  test:
    name: Test Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: aastu_clinic_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U testuser -d aastu_clinic_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    env:
      DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/aastu_clinic_test
      JWT_SECRET: test-only-secret-for-ci
      JWT_EXPIRES_IN: 1d

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Apply database migrations
        run: npx prisma migrate deploy

      - name: Run tests
        run: npm test

      - name: Build TypeScript
        run: npm run build

  build-and-deploy:
    name: Build and Deploy
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Temporary diagnostic step.
      # Prints OIDC claims only, never the actual JWT.
      - name: Debug GitHub OIDC claims
        uses: actions/github-script@v7
        with:
          script: |
            const token = await core.getIDToken("sts.amazonaws.com");

            const payload = JSON.parse(
              Buffer.from(token.split(".")[1], "base64url").toString()
            );

            console.log("OIDC issuer:", payload.iss);
            console.log("OIDC audience:", payload.aud);
            console.log("OIDC subject:", payload.sub);
            console.log("Repository:", payload.repository);
            console.log("Repository ID:", payload.repository_id);
            console.log("Repository owner:", payload.repository_owner);
            console.log("Repository owner ID:", payload.repository_owner_id);
            console.log("Ref:", payload.ref);

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: |
          docker build \
            -t ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ./backend

      - name: Tag Docker image
        run: |
          docker tag \
            ${{ env.ECR_REPOSITORY }}:${{ github.sha }} \
            ${{ env.ECR_URI }}:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push \
            ${{ env.ECR_URI }}:${{ github.sha }}

      - name: Deploy to EC2 through SSM
        id: deploy
        run: |
          IMAGE_URI="${{ env.ECR_URI }}:${{ github.sha }}"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ env.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "AASTU Clinic deployment ${{ github.sha }}" \
            --parameters "commands=[
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com\",
              \"docker pull $IMAGE_URI\",
              \"docker stop aastu-clinic-backend || true\",
              \"docker rm aastu-clinic-backend || true\",
              \"docker run -d --name aastu-clinic-backend --restart unless-stopped -p 5000:5000 --env-file /home/ec2-user/clinic-production.env $IMAGE_URI\",
              \"docker image prune -f\"
            ]" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for deployment
        run: |
          COMMAND_ID="${{ steps.deploy.outputs.command_id }}"

          echo "Waiting for deployment on ${{ env.EC2_INSTANCE_ID }}..."

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}"

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ env.EC2_INSTANCE_ID }}" \
            --query 'Status' \
            --output text)

          echo "Deployment status: $STATUS"

          if [ "$STATUS" != "Success" ]; then
            echo "Deployment failed."

            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "${{ env.EC2_INSTANCE_ID }}" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' \
              --output json

            exit 1
          fi

          echo "Deployment succeeded."
